name: Build iOS & Android Apps (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  # -------------------------------------------------------------
  # JOB 1: BUILD ANDROID APK (MIỄN PHÍ TRÊN UBUNTU LINUX)
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 21 (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt dependencies
        run: npm install --legacy-peer-deps

      - name: Build ứng dụng Web (Vite)
        run: npm run build

      - name: Khởi tạo & Đồng bộ Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Cấp quyền chạy Gradle & phục hồi wrapper nếu thiếu
        run: |
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      - name: Biên dịch file APK Android
        run: |
          cd android
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Tải file APK Android lên GitHub Artifacts để tải về cài máy
        uses: actions/upload-artifact@v4
        with:
          name: TECNIC-MEDTECH-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # -------------------------------------------------------------
  # JOB 2: BUILD IOS APP TRÊN MÁY MACBOOK ẢO CỦA GITHUB
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS App (macOS Cloud)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt dependencies
        run: npm install --legacy-peer-deps

      - name: Build ứng dụng Web (Vite)
        run: npm run build

      - name: Khởi tạo & Đồng bộ Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios || true

      - name: Cài đặt CocoaPods dependencies cho iOS
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install
          else
            echo "ios/App not found, skipping pod install"
          fi

      - name: Biên dịch ứng dụng iOS (Xcode build)
        run: |
          if [ -d "ios/App" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/TECNIC-MEDTECH.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            echo "ios/App directory does not exist, skipping xcodebuild"
          fi

      - name: Đóng gói file App iOS
        run: |
          mkdir -p output-ios
          if [ -d "build/TECNIC-MEDTECH.xcarchive" ]; then
            ditto -c -k --keepParent build/TECNIC-MEDTECH.xcarchive output-ios/TECNIC-MEDTECH-iOS.zip
            if [ -d "build/TECNIC-MEDTECH.xcarchive/Products/Applications/App.app" ]; then
              cd build/TECNIC-MEDTECH.xcarchive/Products/Applications
              zip -r -q ../../../../output-ios/TECNIC-MEDTECH.app.zip App.app
            fi
          else
            echo "iOS build was not generated, creating placeholder note"
            echo "iOS build requires macOS environment and Xcode provisioning." > output-ios/NOTE.txt
          fi

      - name: Tải file iOS App lên GitHub Artifacts để người dùng tải về
        uses: actions/upload-artifact@v4
        with:
          name: TECNIC-MEDTECH-iOS-Build
          path: output-ios/
          retention-days: 14
          if-no-files-found: ignore


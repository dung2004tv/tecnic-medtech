name: Render Tecnic Medtech Video

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chrome dependencies for Remotion
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src/index.ts TecnicVideo out/video.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: tecnic-video
          path: out/video.mp4
          retention-days: 30
